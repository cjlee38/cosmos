baseURL: http://localhost:1313/
locale: en-us
title: cosmos

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: Theme
      weight: 3
      params:
        type: theme-toggle
    - name: GitHub
      url: https://github.com/cjlee38/cosmos
      weight: 4
      params:
        icon: github

params:
  navbar:
    displayLogo: true
    displayTitle: true
    logo:
      path: images/cosmos-icon-light.png
      dark: images/cosmos-icon-dark.png
      link: /
      width: 32
      height: 32
  theme:
    default: system
