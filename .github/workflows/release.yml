name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      APPLE_ID: gptpem38@icloud.com
      APPLE_TEAM_ID: UKA4NU5898
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      COSMOS_SKIP_CODE_SIGNING: "1"
      GH_TOKEN: ${{ github.token }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      COSMOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must run from main." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lint tools
        run: brew install swiftlint periphery

      - name: Check
        run: ./scripts/check.sh

      - name: Lint
        run: ./scripts/lint.sh

      - name: Import release certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build and notarize
        run: ./scripts/notarize.sh --yes

      - name: Create draft release
        run: ./scripts/release.sh
